<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Tín Hữu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2E9; --card:#FFFDF8; --ink:#1E2633; --muted:#6B6F78;
    --line:#DCD5C6; --accent:#8A5A2B; --ok:#3F6B55; --danger:#9B3B2E;
    --r:4px; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#1A1D24; --card:#23272F; --ink:#EDE8DC; --muted:#A3A7B0;
      --line:#3A3F4A; --accent:#D9A266; --ok:#7FB59A; --danger:#E08A7C; color-scheme:dark; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
  h1,h2,h3{font-family:Lora,Georgia,serif;font-weight:600;margin:0 0 .5rem;line-height:1.2}
  h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hidden{display:none!important}
  .sub{color:var(--muted);font-size:.85rem}
  .muted{color:var(--muted)}

  /* Login */
  #login{min-height:100%;display:grid;place-items:center;padding:24px}
  .login-card{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px}
  .login-card p{color:var(--muted);margin:0 0 20px}
  .err{color:var(--danger);font-size:.9rem;min-height:1.2em;margin:8px 0 0}

  /* Shell */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
  aside{background:var(--card);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px}
  .brand{font-family:Lora,serif;font-size:1.25rem;font-weight:700;margin-bottom:20px;padding-left:8px}
  .brand small{display:block;font-family:"Be Vietnam Pro",sans-serif;font-weight:400;color:var(--muted);font-size:.8rem}
  nav button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:9px 12px;border-radius:0 var(--r) var(--r) 0;color:var(--muted);font-weight:500}
  nav button:hover{color:var(--ink)}
  nav button.on{color:var(--ink);border-left-color:var(--accent);background:var(--paper)}
  .me{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;font-size:.85rem}
  .linkbtn{background:none;border:0;color:var(--accent);padding:0;margin-top:6px;text-decoration:underline}
  main{padding:32px clamp(16px,4vw,48px) 96px;max-width:1100px;width:100%}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--line)}

  /* Buttons & inputs */
  .btn{background:var(--ink);color:var(--card);border:0;border-radius:var(--r);padding:9px 16px;font-weight:500}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn.sm{padding:5px 10px;font-size:.85rem}
  input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px}
  label{display:block;font-size:.85rem;color:var(--muted);font-weight:500}
  label input,label select,label textarea{margin-top:4px;color:var(--ink)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar input{flex:1 1 220px;max-width:340px}
  .toolbar select{width:auto;min-width:140px}

  /* Tables / lists */
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.8rem;color:var(--muted);font-weight:600;background:var(--paper)}
  tr:last-child td{border-bottom:0}
  tr[data-open]{cursor:pointer} tr[data-open]:hover td{background:var(--paper)}
  .scroll{overflow-x:auto}
  .empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

  /* Overview */
  .figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:28px}
  .figures div{padding:18px 20px;border-right:1px solid var(--line)}
  .figures div:last-child{border-right:0}
  .figures b{display:block;font-family:Lora,serif;font-size:2rem;font-weight:600;line-height:1.1}
  .figures span{color:var(--muted);font-size:.85rem}
  .figures .lead b{font-size:2.8rem;color:var(--accent)}
  .bars{display:grid;gap:10px}
  .bar{display:grid;grid-template-columns:150px 1fr 56px;gap:12px;align-items:center;font-size:.9rem}
  .bar i{display:block;height:10px;background:var(--accent);border-radius:2px;opacity:.85}
  .bar .track{background:var(--line);border-radius:2px}
  .section{margin-bottom:32px}

  /* Households */
  .tribe-block{margin-bottom:28px}
  .hh-list{display:grid;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  .hh{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .hh:last-child{border-bottom:0}
  .hh:hover{background:var(--paper)}

  /* Dialog */
  dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:0;width:min(640px,calc(100% - 24px));max-height:90vh}
  dialog::backdrop{background:rgba(20,22,28,.45)}
  .dlg{padding:24px;overflow:auto;max-height:90vh}
  .dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .dlg-foot .spacer{flex:1}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .form .full{grid-column:1/-1}
  .hint{font-size:.8rem;color:var(--muted);margin-top:4px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:.95rem;margin-bottom:16px}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  .tag{display:inline-block;font-size:.78rem;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);margin-right:4px}
  .inline-form{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:8px;align-items:end;margin-top:12px}
  .inline-form label{margin:0}

  /* Finance */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;color:var(--muted);font-weight:500;margin-bottom:-1px}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .matrix{overflow:visible}
  .matrix th,.matrix td{white-space:nowrap}
  .matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
  .matrix th:first-child,.matrix tfoot td:first-child{background:var(--paper)}
  .matrix tfoot td{font-weight:600;background:var(--paper)}
  .figures.fin div{min-width:0}
  .figures.fin b{font-size:1.6rem;overflow-wrap:anywhere}
  .figures.fin .lead b{font-size:1.9rem;color:var(--accent)}
  .bars.fin .bar{grid-template-columns:76px 1fr 120px}
  .bars.fin .bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .check{display:flex;gap:8px;align-items:center}
  .check input{width:auto;margin:0}
  .newdonor{display:grid;gap:12px;border:1px dashed var(--accent);border-radius:var(--r);padding:14px}
  .newdonor .form{gap:12px 16px}
  .newdonor p{margin:0;font-size:.9rem}
  .badge{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);margin-left:6px;vertical-align:middle}

  /* Thu nhanh */
  .qwrap{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:32px;align-items:start}
  .quick{display:grid;gap:16px}
  .quick .btn.big{padding:14px 18px;font-size:1.05rem}
  .qline{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
  .qline input,.qline select{margin:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .chip:hover{border-color:var(--accent)}
  .qtotal{font-family:Lora,serif;font-size:1.4rem;min-height:2.6em}
  .qtotal small{display:block;font-family:"Be Vietnam Pro",sans-serif;font-size:.85rem;color:var(--muted)}
  .seg{display:flex;gap:20px}
  .seg label{display:flex;gap:6px;align-items:center;color:var(--ink)}
  .seg input{width:auto;margin:0}
  .flash{color:var(--ok);font-weight:500;min-height:1.4em}
  .today-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .today-row:last-child{border-bottom:0}

  /* In biên nhận */
  #printArea{display:none}
  .rc{font-family:"Be Vietnam Pro",Arial,sans-serif;color:#000;background:#fff;line-height:1.35}
  .paper-80 .rc{width:72mm;margin:0 auto;padding:4mm 0 10mm;font-size:12px}
  .paper-58 .rc{width:48mm;margin:0 auto;padding:3mm 0 10mm;font-size:10.5px}
  .paper-a5 .rc{width:100%;font-size:14px}
  .rc h1{font-family:Lora,Georgia,serif;font-size:1.3em;text-align:center;margin:0 0 2px;color:#000}
  .rc .c{text-align:center}
  .rc .small{font-size:.85em}
  .rc hr{border:0;border-top:1px dashed #000;margin:7px 0}
  .rc .row{display:flex;justify-content:space-between;gap:8px}
  .rc .tot{font-weight:700;font-size:1.15em}
  .rc .stamp{text-align:center;font-weight:700;border:1px solid #000;padding:2px;margin:4px 0}
  .rc .sig{display:none}
  .paper-a5 .rc .sig{display:flex;justify-content:space-around;text-align:center;margin-top:40px}
  @media print{
    #app,#login,dialog{display:none!important}
    html,body{background:#fff!important}
    #printArea{display:block!important}
  }

  /* Trường Chúa Nhật */
  .att-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .att-count{font-weight:600}
  .att-list{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  .att-row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
  .att-row:last-child{border-bottom:0}
  .att-row .nm small{display:block;color:var(--muted);font-size:.8rem}
  .tg{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.9rem;white-space:nowrap;cursor:pointer;margin:0;padding:6px}
  .tg input{width:22px;height:22px;margin:0}
  .matrix td small{color:var(--muted)}
  .exp{display:inline-flex;gap:6px;flex-wrap:wrap}
  .short{display:none}

  .cred{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;margin-top:8px}

  /* Mobile */
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    aside{position:fixed;bottom:0;left:0;right:0;top:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);z-index:5}
    .brand{display:none}
    .me{display:flex;position:fixed;top:0;right:0;z-index:6;margin:0;padding:6px 12px;background:var(--card);border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line);border-radius:0 0 0 var(--r)}
    #meName,#meRole{display:none}
    .me .linkbtn{margin:0!important;font-size:.8rem}
    nav{display:flex;width:100%;overflow-x:auto}
    nav button{flex:1 0 auto;white-space:nowrap;text-align:center;border-left:0;border-top:3px solid transparent;border-radius:0;padding:8px 10px;font-size:.78rem}
    nav button.on{border-top-color:var(--accent);border-left:0}
    main{padding:44px 16px 110px}
    .form{grid-template-columns:1fr}
    .bar{grid-template-columns:110px 1fr 44px}
    .inline-form{grid-template-columns:1fr}
    .kv{grid-template-columns:1fr;gap:2px}
    .kv dt{margin-top:8px}
    .toolbar select,.toolbar input{max-width:none;width:100%}
    #mlist th:nth-child(4),#mlist td:nth-child(4){display:none}
    .bars.fin .bar{grid-template-columns:56px 1fr 96px}
    .tabs button{flex:1;padding:9px 4px;font-size:.85rem}
    .long{display:none}.short{display:inline}
    .att-row{grid-template-columns:1fr 1fr}.att-row .nm{grid-column:1/-1}
    .qwrap{grid-template-columns:1fr}
    .qline{grid-template-columns:1fr 1fr auto}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<!-- Đăng nhập -->
<section id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <h1>Sổ Tín Hữu</h1>
    <p>Đăng nhập bằng tài khoản được cấp. Liên hệ thư ký nếu chưa có tài khoản.</p>
    <label>Email<input type="email" id="email" required autocomplete="username"></label>
    <div style="height:12px"></div>
    <label>Mật khẩu<input type="password" id="pw" required autocomplete="current-password"></label>
    <div style="height:18px"></div>
    <button class="btn" type="submit" style="width:100%">Đăng nhập</button>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<!-- Ứng dụng -->
<div id="app" class="app hidden">
  <aside>
    <div class="brand">Sổ Tín Hữu<small id="churchName">Hội Thánh</small></div>
    <nav>
      <button data-act="nav" data-view="overview" data-view-btn data-roles="admin,tribe">Tổng quan</button>
      <button data-act="nav" data-view="members" data-view-btn data-roles="admin,tribe">Thành viên</button>
      <button data-act="nav" data-view="households" data-view-btn data-roles="admin,tribe">Hộ gia đình</button>
      <button data-act="nav" data-view="courses" data-view-btn data-roles="admin,tribe">Khóa học</button>
      <button data-act="nav" data-view="reports" data-view-btn data-roles="admin,tribe">Báo cáo</button>
      <button data-act="nav" data-view="offerings" data-view-btn data-roles="admin,finance">Dâng hiến</button>
      <button data-act="nav" data-view="sschool" data-view-btn><span class="long">Trường Chúa Nhật</span><span class="short">Trường CN</span></button>
      <button data-act="nav" data-view="users" data-view-btn data-roles="admin">Tài khoản</button>
    </nav>
    <div class="me">
      <div id="meName"></div>
      <div class="sub" id="meRole"></div>
      <button class="linkbtn" data-act="pw-reset">Đổi mật khẩu</button>
      <button class="linkbtn" data-act="logout" style="margin-left:12px">Đăng xuất</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg"></dialog>
<div id="printArea" aria-hidden="true"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ CẤU HÌNH ============
   Dán cấu hình từ Firebase Console > Project settings > Your apps */
const firebaseConfig = {
  apiKey: "AIzaSyABIvZ3Ic-IPbkSWOynAm0yff9cvdFy3c0",
  authDomain: "hmcdigital-20f18.firebaseapp.com",
  projectId: "hmcdigital-20f18",
  storageBucket: "hmcdigital-20f18.firebasestorage.app",
  messagingSenderId: "970947520625",
  appId: "1:970947520625:web:55e7185ee39880f56513d0"
};
const CHURCH_NAME = "Hội Thánh Tin Lành";
// Thông tin in trên biên nhận: sửa theo thực tế hội thánh

// Danh mục quỹ: sửa theo thực tế hội thánh. Đổi tên về sau không làm mất dữ liệu cũ (báo cáo vẫn gom theo tên đã lưu).
const FUNDS = ["Thập phân","Dâng hiến thường","Xây dựng","Truyền giáo","Từ thiện","Dâng đặc biệt","Khác"];
const METHODS = ["Tiền mặt","Chuyển khoản"];
const NOW = new Date().getFullYear();

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const secAuth = getAuth(initializeApp(firebaseConfig, "provision"));   // ứng dụng phụ, chỉ dùng để tạo tài khoản mới

/* ============ TRẠNG THÁI ============ */
let me = null;                 // {uid, name, role:'admin'|'tribe', tribe}
let members = [], households = [], courses = [], enrollments = [];
let offeringsByYear = {};      // cache: { 2026: [...] }, tải theo năm để tiết kiệm lượt đọc
let view = "overview";

/* ============ TIỆN ÍCH ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const num = v => (v === "" || v == null) ? null : Number(v);
const opt = (v, sel, label) => `<option value="${esc(v)}" ${String(v)===String(sel ?? "") ? "selected":""}>${esc(label ?? v)}</option>`;
const givenName = fullName => (fullName || "").trim().split(/\s+/).pop() || "";
const ageOf = y => y ? NOW - y : null;
const isAdmin = () => me?.role === "admin";
const isFinance = () => me?.role === "finance";
const canViewFinance = () => isAdmin() || isFinance();   // Mục sư, Thư ký: chỉ xem
const canEditFinance = () => isFinance();                // Chỉ trưởng ban tài chính được nhập, sửa, xóa
const tribeName = t => t ? `Chi phái ${t}` : "Chưa rõ";

function ageGroup(y){
  const a = ageOf(y);
  if (a == null) return "Chưa có năm sinh";
  if (a <= 11) return "Thiếu nhi (0–11)";
  if (a <= 17) return "Thiếu niên (12–17)";
  if (a <= 29) return "Thanh niên (18–29)";
  if (a <= 59) return "Trưởng thành (30–59)";
  return "Cao niên (60+)";
}
// Gợi ý ban theo tuổi và giới tính, người quản lý vẫn có thể đổi
function suggestMinistry(y, gender){
  const a = ageOf(y);
  if (a == null) return "";
  if (a <= 11) return "Thiếu nhi";
  if (a <= 17) return "Thiếu niên";
  if (a <= 29) return "Thanh niên";
  if (a >= 60) return "Cao niên";
  return gender === "Nữ" ? "Phụ nữ" : "Nam giới";
}
const sortByName = (a,b) => givenName(a.fullName).localeCompare(givenName(b.fullName), "vi") || a.fullName.localeCompare(b.fullName, "vi");

function openDialog(html){ $("#dlg").innerHTML = html; $("#dlg").showModal(); }
function closeDialog(){ $("#dlg").close(); }
const alertErr = msg => alert(msg);

/* ============ DỮ LIỆU ============ */
async function loadData(){
  if (isFinance()){
    // Trưởng ban tài chính cần danh sách tín hữu để chọn người dâng; không tải hộ, khóa học
    const m = await getDocs(collection(db, "members"));
    members = m.docs.map(d => ({id:d.id, ...d.data()}));
    households = []; courses = []; enrollments = [];
    await loadOfferingYear(offFilter.year);
    return;
  }
  if (me.role === "ss"){
    // Trường Chúa Nhật: cần danh sách tín hữu để thêm vào lớp và danh sách khóa học
    const [m, c] = await Promise.all([getDocs(collection(db, "members")), getDocs(collection(db, "courses"))]);
    members = m.docs.map(d => ({id:d.id, ...d.data()}));
    courses = c.docs.map(d => ({id:d.id, ...d.data()}));
    households = []; enrollments = [];
    return;
  }
  const scoped = col => isAdmin()
    ? getDocs(collection(db, col))
    : getDocs(query(collection(db, col), where("tribe", "==", me.tribe)));
  const [m, h, c, e] = await Promise.all([
    scoped("members"), scoped("households"), getDocs(collection(db,"courses")), scoped("enrollments")
  ]);
  members     = m.docs.map(d => ({id:d.id, ...d.data()}));
  households  = h.docs.map(d => ({id:d.id, ...d.data()}));
  courses     = c.docs.map(d => ({id:d.id, ...d.data()}));
  enrollments = e.docs.map(d => ({id:d.id, ...d.data()}));
}

let loginMsg = "";
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#pw").value);
  } catch {
    $("#loginErr").textContent = "Email hoặc mật khẩu chưa đúng.";
  }
});

onAuthStateChanged(auth, async user => {
  if (!user) { showLogin(); return; }
  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists()) {
    await signOut(auth);
    showLogin("Tài khoản chưa được cấp quyền. Liên hệ thư ký để được thêm.");
    return;
  }
  const d = snap.data();
  if (d.active === false) {
    await signOut(auth);
    showLogin("Tài khoản đã bị khóa. Liên hệ quản trị viên.");
    return;
  }
  if (!["admin","tribe","finance","ss"].includes(d.role) || (d.role === "ss" && !["head","secretary","teacher"].includes(d.ss))) {
    await signOut(auth);
    showLogin("Tài khoản chưa được gán vai trò hợp lệ. Liên hệ thư ký.");
    return;
  }
  if (d.role === "tribe" && !TRIBES.includes(Number(d.tribe))) {
    await signOut(auth);
    showLogin("Tài khoản chưa gán chi phái. Liên hệ thư ký.");
    return;
  }
  me = { uid: user.uid, name: d.name || user.email, role: d.role, tribe: d.tribe ? Number(d.tribe) : null,
         ss: ["head","secretary","teacher"].includes(d.ss) ? d.ss : null, email: String(user.email || "").toLowerCase() };
  $("#meName").textContent = me.name;
  const ssLabel = { head: "Trưởng ban Trường Chúa Nhật", secretary: "Thư ký Trường Chúa Nhật", teacher: "Giáo viên / trợ giảng" }[me.ss] || "";
  $("#meRole").textContent = isAdmin() ? "Quản lý toàn hội thánh"
    : isFinance() ? "Trưởng ban tài chính"
    : me.role === "ss" ? ssLabel
    : `Chi phái trưởng · ${tribeName(me.tribe)}` + (ssLabel ? ` · ${ssLabel}` : "");
  document.querySelectorAll("[data-roles]").forEach(b =>
    b.classList.toggle("hidden", !b.dataset.roles.split(",").includes(me.role)));
  document.querySelector('[data-view="sschool"]').classList.toggle("hidden", !ssAny());
  resetSchool();
  offeringsByYear = {};
  view = isFinance() ? "offerings" : me.role === "ss" ? "sschool" : "overview";
  offTab = isFinance() ? "quick" : "list";
  $("#churchName").textContent = CHURCH_NAME;
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  await loadData();
  render();
});

function showLogin(msg = ""){
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  $("#loginErr").textContent = msg;
}

/* ============ ĐIỀU HƯỚNG ============ */
function render(){
  let allowed = [];
  if (isFinance()) allowed = ["offerings"];
  else {
    if (me.role === "admin" || me.role === "tribe") allowed.push("overview","members","households","courses","reports");
    if (isAdmin()) allowed.push("offerings", "users");
    if (ssAny()) allowed.push("sschool");
  }
  if (!allowed.includes(view)) view = allowed[0];
  document.querySelectorAll("[data-view-btn]").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  ({ overview: () => withRegular(vOverview), members: vMembers, households: vHouseholds, courses: vCourses,
     reports: () => withRegular(vReports), offerings: vOfferings, sschool: vSchool, users: vUsers })[view]();
}

function vOverview(){
  const total = members.length;
  const nam = members.filter(m => m.gender === "Nam").length;
  const nu = members.filter(m => m.gender === "Nữ").length;
  const baptized = members.filter(m => m.baptismYear).length;
  const noHH = members.filter(m => !m.householdId).length;
  const noMin = members.filter(m => !m.ministry).length;
  const pct = total ? Math.round(baptized / total * 100) : 0;

  const byTribe = TRIBES.map(t => {
    const ms = members.filter(m => m.tribe === t);
    return { t, n: ms.length, hh: households.filter(h => h.tribe === t).length,
             bap: ms.filter(m => m.baptismYear).length };
  }).filter(r => isAdmin() || r.t === me.tribe);

  const minCount = MINISTRIES.map(k => ({ k, n: members.filter(m => m.ministry === k).length }));
  const maxMin = Math.max(1, ...minCount.map(x => x.n));

  $("#main").innerHTML = `
    <div class="head"><div><h1>Tổng quan</h1><div class="sub">${isAdmin() ? "Toàn hội thánh" : tribeName(me.tribe)} · cập nhật ${new Date().toLocaleDateString("vi-VN")}</div></div></div>

    <div class="figures">
      <div class="lead"><b>${total}</b><span>Tín hữu</span></div>
      <div><b>${nam}</b><span>Nam</span></div>
      <div><b>${nu}</b><span>Nữ</span></div>
      <div><b>${households.length}</b><span>Hộ gia đình</span></div>
      <div><b>${pct}%</b><span>Đã báp-têm (${baptized})</span></div>
      <div><b>${noHH + noMin}</b><span>Cần bổ sung hộ/ban</span></div>
    </div>

    ${isAdmin() ? `<div class="section"><h2>Theo chi phái</h2>
      <div class="scroll"><table><thead><tr><th>Chi phái</th><th>Tín hữu</th><th>Hộ</th><th>Đã báp-têm</th></tr></thead><tbody>
      ${byTribe.map(r => `<tr><td>${tribeName(r.t)}</td><td>${r.n}</td><td>${r.hh}</td><td>${r.bap}</td></tr>`).join("")}
      </tbody></table></div></div>` : ""}

    <div class="section"><h2>Theo ban</h2>
      <div class="bars">
        ${minCount.map(x => `<div class="bar"><span>${x.k}</span>
          <div class="track"><i style="width:${(x.n/maxMin*100).toFixed(1)}%;display:block"></i></div>
          <span>${x.n}</span></div>`).join("")}
        ${noMin ? `<div class="bar"><span class="muted">Chưa xếp ban</span><span></span><span>${noMin}</span></div>` : ""}
      </div>
    </div>`;
}

function renderMemberList(){

    .filter(m => !t || m.tribe === Number(t))

async function saveMember(id, fd){
  const tribe = isAdmin() ? num(fd.get("tribe")) : me.tribe;
  const memberType = fd.get("memberType") === "Vãng lai" ? "Vãng lai" : "Thành viên";
  if (memberType !== "Vãng lai" && !TRIBES.includes(tribe)) return alertErr("Vui lòng chọn chi phái cho tín hữu của hội thánh.");
  const data = {
    fullName: fd.get("fullName").trim(),
    searchName: fold(fd.get("fullName")),
    memberType,
    gender: fd.get("gender") || null,
    birthYear: num(fd.get("birthYear")),
    faithYear: num(fd.get("faithYear")),
    baptismYear: num(fd.get("baptismYear")),
    tribe,
    ministry: fd.get("ministry") || null,
    householdId: fd.get("householdId") || null,
    relation: fd.get("relation") || null,
    address: fd.get("address").trim(),
    note: fd.get("note").trim(),
    updatedAt: serverTimestamp()
  };
  if (id) await updateDoc(doc(db, "members", id), data);
  else    await addDoc(collection(db, "members"), { ...data, createdAt: serverTimestamp() });
  await loadData(); closeDialog(); render();
}

async function deleteMember(id){
  const m = members.find(x => x.id === id);
  if (!m || !confirm(`Xóa “${m.fullName}” khỏi sổ? Không thể hoàn tác.`)) return;
  for (const e of enrollments.filter(e => e.memberId === id)) await deleteDoc(doc(db, "enrollments", e.id));

function exportCSV(){
  const rows = [["Họ và tên","Giới tính","Năm sinh","Năm tin Chúa","Năm báp-têm","Chi phái","Ban","Hộ","Quan hệ","Địa chỉ","Ghi chú"]];
  members.slice().sort(sortByName).forEach(m => {
    const hh = households.find(h => h.id === m.householdId);
    rows.push([m.fullName, m.gender, m.birthYear, m.faithYear, m.baptismYear, m.tribe, m.ministry, hh?.name, m.relation, m.address, m.note]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: `thanh-vien-${new Date().toISOString().slice(0,10)}.csv` });
  a.click();
  URL.revokeObjectURL(url);
}

async function loadOfferingYear(y, force = false){
  if (!canViewFinance()) return [];
  if (!force && offeringsByYear[y]) return offeringsByYear[y];
  const snap = await getDocs(query(collection(db, "offerings"), where("year", "==", y)));
  offeringsByYear[y] = snap.docs.map(d => ({ id: d.id, ...d.data() }));

}

    .filter(o => !offFilter.month || o.month === Number(offFilter.month))
    .filter(o => !offFilter.fund || o.fund === offFilter.fund)
    .filter(o => !q || fold(o.donorName).includes(q) || String(o.receiptNo || "").includes(q))
    .sort((a, b) => b.date.localeCompare(a.date) || String(a.donorName).localeCompare(String(b.donorName), "vi"));

/* ---- Nhập liệu ---- */
function donorLabels(){
  const map = new Map();
  members.slice().sort(sortByName).forEach(m => {
    let label = `${m.fullName} (Chi phái ${m.tribe || "?"}${m.birthYear ? ", sinh " + m.birthYear : ""})`;
    if (map.has(label)){ let i = 2; while (map.has(`${label} #${i}`)) i++; label = `${label} #${i}`; }
    map.set(label, m);
  });
  return map;
}

// Xác định người dâng từ form (chọn tín hữu, gõ tên tự do, ẩn danh hoặc thêm mới vào danh sách). Trả về null nếu thiếu dữ liệu.
async function resolveDonor(fd){
  if (fd.get("anon") === "on") return { donorId: null, donorName: "Ẩn danh", tribe: null, anon: true };
  const text = (fd.get("donor") || "").trim();
  if (!text){ alertErr("Vui lòng nhập người dâng hoặc chọn dâng ẩn danh."); return null; }
  const m = donorLabels().get(text);
  if (m) return { donorId: m.id, donorName: m.fullName, tribe: m.tribe || null, anon: false };
  const out = { donorId: null, donorName: text, tribe: null, anon: false };
  if (fd.get("addMember") === "on"){
    const mType = fd.get("mType") || "Vãng lai";
    const nTribe = num(fd.get("nTribe"));
    if (mType === "Thành viên" && !TRIBES.includes(nTribe)){ alertErr("Vui lòng chọn chi phái cho tín hữu mới."); return null; }
    const dup = members.find(x => fold(x.fullName) === fold(text));
    if (dup && !confirm(`Đã có “${dup.fullName}” trong danh sách tín hữu. Bấm Hủy để quay lại và chọn người đó, hoặc OK để vẫn thêm một người mới trùng tên.`)) return null;
    const base = {
      fullName: text, searchName: fold(text), gender: null, birthYear: null, faithYear: null, baptismYear: null,
      tribe: TRIBES.includes(nTribe) ? nTribe : null, ministry: fd.get("nMinistry") || null,
      householdId: null, relation: null, address: "", note: "Thêm từ mục Dâng hiến", memberType: mType
    };
    try {
      const ref = await addDoc(collection(db, "members"), { ...base, createdBy: me.name, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      members.push({ id: ref.id, ...base });
      out.donorId = ref.id; out.tribe = base.tribe;
    } catch (err){ alertErr("Chưa thêm được tín hữu mới: " + err.message); return null; }
  }
  return out;
}

// Đọc số tiền bằng chữ tiếng Việt
function vnWords(n){
  n = Math.round(Number(n) || 0);
  if (n <= 0) return "Không đồng";
  const dg = ["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
  const triple = (x, full) => {
    const tr = Math.floor(x / 100), ch = Math.floor(x % 100 / 10), dv = x % 10, out = [];
    if (full || tr > 0) out.push(dg[tr], "trăm");
    if (ch > 1){
      out.push(dg[ch], "mươi");
      if (dv === 1) out.push("mốt"); else if (dv === 4) out.push("tư"); else if (dv === 5) out.push("lăm"); else if (dv > 0) out.push(dg[dv]);
    } else if (ch === 1){
      out.push("mười");
      if (dv === 5) out.push("lăm"); else if (dv > 0) out.push(dg[dv]);
    } else if (dv > 0){
      if (full || tr > 0) out.push("lẻ");
      out.push(dg[dv]);
    }
    return out.join(" ");
  };
  const below = (x, started) => {
    const out = [];
    for (const [g, label] of [[Math.floor(x / 1e6) % 1000, "triệu"], [Math.floor(x / 1e3) % 1000, "nghìn"], [x % 1000, ""]]){
      if (!g) continue;
      out.push((triple(g, started) + " " + label).trim());
      started = true;
    }
    return out.join(" ");
  };
  const read = x => x >= 1e9 ? read(Math.floor(x / 1e9)) + " tỷ" + (x % 1e9 ? " " + below(x % 1e9, true) : "") : below(x, false);
  const t = read(n) + " đồng";
  return t.charAt(0).toUpperCase() + t.slice(1);
}

// Cấp số biên nhận và ghi các dòng dâng hiến trong cùng một giao dịch: không trùng số, không bỏ sót số
async function createReceipt({ donor, lines, method, note = "" }){
  const date = todayStr();
  const [y, mo] = date.split("-").map(Number);
  const time = new Date().toTimeString().slice(0, 5);
  const cref = doc(db, "counters", "receipt-" + NOW);
  const refs = lines.map(() => doc(collection(db, "offerings")));
  const base = {
    date, time, year: y, month: mo, quarter: quarterOf(mo),
    donorId: donor.donorId, donorName: donor.donorName, tribe: donor.tribe, anonymous: donor.anon,
    method, note, createdBy: me.name, updatedBy: me.name, printCount: 0
  };
  let no = "", seq = 0;
  await runTransaction(db, async tx => {
    const cs = await tx.get(cref);
    seq = (cs.exists() ? cs.data().last : 0) + 1;
    no = `${NOW}-${String(seq).padStart(5, "0")}`;
    tx.set(cref, { last: seq });
    lines.forEach((l, i) => tx.set(refs[i], {
      ...base, fund: l.fund, amount: l.amount, receiptNo: no, receiptSeq: seq,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    }));
  });
  const recs = lines.map((l, i) => ({ id: refs[i].id, ...base, fund: l.fund, amount: l.amount, receiptNo: no, receiptSeq: seq }));
  if (offeringsByYear[y]) offeringsByYear[y].push(...recs);   // cập nhật bộ nhớ tạm, không phải tải lại cả năm
  return { no, recs };
}

function reportYears(){
  return repMode === "year" ? Array.from({ length: 5 }, (_, i) => NOW - 4 + i) : [repYear];
}

function reportData(){
  const years = reportYears();
  const data = years.flatMap(y => offeringsByYear[y] || []).filter(o => !o.voided);
  let cols, keyOf;
  if (repMode === "month"){
    cols = Array.from({ length: 12 }, (_, i) => ({ key: i + 1, label: "Tháng " + (i + 1), short: "T" + (i + 1) }));
    keyOf = o => o.month;
  } else if (repMode === "quarter"){
    cols = [1, 2, 3, 4].map(q => ({ key: q, label: "Quý " + q, short: "Quý " + q }));
    keyOf = o => quarterOf(o.month);
  } else {
    cols = years.map(y => ({ key: y, label: String(y), short: String(y) }));
    keyOf = o => o.year;
  }
  const funds = [...new Set([...FUNDS, ...data.map(o => o.fund)])];
  const cell = {};
  funds.forEach(f => cell[f] = {});
  data.forEach(o => { const k = keyOf(o); cell[o.fund][k] = (cell[o.fund][k] || 0) + o.amount; });
  return { data, cols, funds, cell };
}

/* ---- Xuất CSV ---- */
function downloadCSV(rows, name){
  const safe = v => typeof v === "string" && /^[=+\-@]/.test(v) ? "'" + v : v;   // tránh công thức độc hại khi mở bằng Excel
  const csv = rows.map(r => r.map(v => `"${String(safe(v) ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  a.click();
  URL.revokeObjectURL(url);
}

function exportOfferings(){
  const rows = [["Ngày","Số biên nhận","Người dâng","Chi phái","Quỹ","Số tiền (VND)","Hình thức","Ghi chú","Người nhập","Trạng thái"]];
  filteredOfferings().forEach(o => rows.push([fmtDate(o.date), o.receiptNo, o.anonymous ? "Ẩn danh" : o.donorName, o.tribe, o.fund, o.amount, o.method, o.note, o.updatedBy || o.createdBy, o.voided ? "Đã hủy" : "Hợp lệ"]));
  downloadCSV(rows, `dang-hien-${offFilter.year}${offFilter.month ? "-t" + offFilter.month : ""}.csv`);
}

function exportReport(){
  const { cols, funds, cell } = reportData();
  const rows = [["Quỹ", ...cols.map(c => c.label), repMode === "year" ? "Tổng" : "Cả năm"]];
  funds.forEach(f => rows.push([f, ...cols.map(c => cell[f][c.key] || 0), cols.reduce((s, c) => s + (cell[f][c.key] || 0), 0)]));
  rows.push(["Tổng", ...cols.map(c => funds.reduce((s, f) => s + (cell[f][c.key] || 0), 0)), funds.reduce((s, f) => s + cols.reduce((t, c) => t + (cell[f][c.key] || 0), 0), 0)]);
  downloadCSV(rows, `bao-cao-tai-chinh-${repMode}-${repMode === "year" ? NOW : repYear}.csv`);
}

/* ---- Xuất file ---- */
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => res(window.XLSX);
    s.onerror = () => rej(new Error("Không tải được thư viện Excel"));
    document.head.appendChild(s);
  });
}
async function downloadRows(rows, base, fmt){
  if (fmt === "xlsx"){
    try {
      const X = await loadXLSX();
      const wb = X.utils.book_new();
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(rows), "Danh sach");
      X.writeFile(wb, base + ".xlsx");
      return;
    } catch (err){ alertErr(err.message + ". Hệ thống xuất CSV thay thế, Excel mở được file này."); }
  }
  downloadCSV(rows, base + ".csv");
}

async function loadSchool(){
  if (SS.loaded) return;
  const snap = await getDocs(collection(db, "classes"));
  SS.classes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name), "vi"));
  SS.loaded = true;
}
async function loadRoster(id, force = false){
  if (!force && SS.rosters[id]) return SS.rosters[id];
  const snap = await getDocs(query(collection(db, "classMembers"), where("classId", "==", id)));
  SS.rosters[id] = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(rosterSort);
  return SS.rosters[id];
}
async function loadAllRosters(){
  if (SS.allRosters) return;
  const snap = await getDocs(collection(db, "classMembers"));
  const by = {};
  snap.docs.forEach(d => { const r = { id: d.id, ...d.data() }; (by[r.classId] = by[r.classId] || []).push(r); });
  SS.classes.forEach(c => { SS.rosters[c.id] = (by[c.id] || []).sort(rosterSort); });
  SS.allRosters = true;
}
async function loadClassSession(classId, date){
  const s = await getDoc(doc(db, "classSessions", `${classId}_${date}`));
  return s.exists() ? { id: s.id, ...s.data() } : null;
}
async function loadSessionsYear(y){
  if (SS.sessYear[y]) return SS.sessYear[y];
  const snap = await getDocs(query(collection(db, "classSessions"), where("year", "==", y)));
  SS.sessYear[y] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  return SS.sessYear[y];
}
async function loadStudents(id, force = false){
  if (!force && SS.students[id]) return SS.students[id];
  const snap = await getDocs(query(collection(db, "enrollments"), where("courseId", "==", id)));
  const map = new Map();
  snap.docs.forEach(d => {
    const s = { id: d.id, ...d.data() };
    if (!map.has(s.memberId) || d.id.startsWith(id + "_")) map.set(s.memberId, s);   // gộp bản ghi trùng người
  });
  SS.students[id] = [...map.values()].sort((a, b) => sortByName({ fullName: a.memberName }, { fullName: b.memberName }));
  return SS.students[id];
}
async function loadCSessions(id, force = false){
  if (!force && SS.cSess[id]) return SS.cSess[id];
  const snap = await getDocs(query(collection(db, "courseSessions"), where("courseId", "==", id)));
  SS.cSess[id] = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.date.localeCompare(b.date));
  return SS.cSess[id];
}

function bindAtt(sel, withVerse){
  const list = $(sel);
  if (!list) return;
  list.addEventListener("change", e => {
    const cb = e.target;
    if (!cb.dataset.k) return;
    const row = cb.closest(".att-row");
    const p = row.querySelector('[data-k="p"]'), v = row.querySelector('[data-k="v"]');
    if (v && cb.dataset.k === "v" && v.checked) p.checked = true;
    if (v && cb.dataset.k === "p" && !p.checked) v.checked = false;
    attCount(sel, withVerse);
  });
  attCount(sel, withVerse);
}
function attCount(sel, withVerse){
  const list = $(sel);
  if (!list || !$("#aCount")) return;
  const total = list.querySelectorAll('[data-k="p"]').length;
  const p = list.querySelectorAll('[data-k="p"]:checked').length;
  const v = withVerse ? list.querySelectorAll('[data-k="v"]:checked').length : 0;
  $("#aCount").textContent = `Có mặt ${p}/${total}` + (withVerse ? `, thuộc câu gốc ${v}` : "");
}

      const c = { name: k, ministry: k, teacherEmails: [], active: true, order: SS.classes.length + i + 1, createdBy: me.name };
      batch.set(ref, { ...c, createdAt: serverTimestamp() });
      return { id: ref.id, ...c };

    SS.classes.push(...made);
    made.forEach(c => SS.rosters[c.id] = []);

      const roster = await loadRoster(cls.id);
      if (roster.some(r => r.memberId === m.id)) return alertErr(`${m.fullName} đã có trong lớp.`);
      const rec = { classId: cls.id, memberId: m.id, memberName: m.fullName, gender: m.gender || null, birthYear: m.birthYear || null,
        tribe: m.tribe || null, ministry: m.ministry || null, addedBy: me.name };
      await setDoc(doc(db, "classMembers", `${cls.id}_${m.id}`), { ...rec, addedAt: serverTimestamp() });
      roster.push({ id: `${cls.id}_${m.id}`, ...rec }); roster.sort(rosterSort);
      await ssClassDetail();
    } else {
      const c = courses.find(x => x.id === SS.courseId);
      const students = await loadStudents(c.id);
      if (students.some(s => s.memberId === m.id)) return alertErr(`${m.fullName} đã có trong khóa học.`);
      const rec = { memberId: m.id, memberName: m.fullName, tribe: m.tribe || null, courseId: c.id, courseName: c.name,
        courseType: c.type || null, year: c.year || NOW, result: null, score: null, createdBy: me.name };
      await setDoc(doc(db, "enrollments", `${c.id}_${m.id}`), { ...rec, createdAt: serverTimestamp() });
      students.push({ id: `${c.id}_${m.id}`, ...rec });
      students.sort((a, b) => sortByName({ fullName: a.memberName }, { fullName: b.memberName }));
      await ssCourseDetail();
    }
    document.querySelector("#fadd input[name=donor]")?.focus();
  } catch (err){ alertErr("Chưa thêm được: " + err.message); }
}

async function loadFromMinistry(){
  const cls = SS.classes.find(c => c.id === SS.detailClass);
  if (!cls?.ministry) return;
  const roster = await loadRoster(cls.id);
  const have = new Set(roster.map(r => r.memberId));
  const cand = members.filter(m => m.ministry === cls.ministry && m.memberType !== "Vãng lai" && !have.has(m.id));
  if (!cand.length) return alertErr(`Không có thêm người nào thuộc ban ${cls.ministry} chưa vào lớp.`);
  if (!confirm(`Thêm ${cand.length} người thuộc ban ${cls.ministry} vào lớp ${cls.name}?`)) return;
  try {
    for (let i = 0; i < cand.length; i += BATCH){   // lô nhỏ vì Firestore Rules giới hạn số lần kiểm tra quyền mỗi lệnh ghi hàng loạt
      const batch = writeBatch(db);
      cand.slice(i, i + BATCH).forEach(m => batch.set(doc(db, "classMembers", `${cls.id}_${m.id}`), {
        classId: cls.id, memberId: m.id, memberName: m.fullName, gender: m.gender || null, birthYear: m.birthYear || null,
        tribe: m.tribe || null, ministry: m.ministry || null, addedBy: me.name, addedAt: serverTimestamp() }));
      await batch.commit();
    }
    await loadRoster(cls.id, true);
  } catch (err){ return alertErr("Chưa nạp được: " + err.message); }
  ssClassDetail();
}

/* ---- Tổng hợp theo tuần ---- */
function summaryData(all){
  const cls = myClasses(true);
  const ids = new Set(cls.map(c => c.id));
  const sess = all.filter(s => ids.has(s.classId) && (!SS.month || s.month === Number(SS.month)));
  const byDate = new Map();
  sess.forEach(s => { if (!byDate.has(s.date)) byDate.set(s.date, {}); byDate.get(s.date)[s.classId] = s; });
  const rows = [...byDate.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([date, m]) => {
    let p = 0, v = 0, g = 0;
    Object.values(m).forEach(s => { p += s.presentCount || 0; v += s.verseCount || 0; g += s.guests || 0; });
    return { date, m, p, v, g, total: p + g };
  });
  return { cls, rows };
}

      ${rows.length ? exportBtns("summary") : ""}
    </div>

async function saveResults(){
  const c = courses.find(x => x.id === SS.courseId);
  const students = SS.students[c.id] || [];
  const changes = [];
  students.forEach(s => {
    const sc = document.querySelector(`input[data-sid="${CSS.escape(s.id)}"]`);
    const rs = document.querySelector(`select[data-sid="${CSS.escape(s.id)}"]`);
    if (!sc || !rs) return;
    const score = sc.value === "" ? null : Number(sc.value);
    const result = rs.value || null;
    if (score !== (s.score ?? null) || result !== (s.result ?? null)) changes.push({ s, score, result });
  });
  if (!changes.length){ $("#rMsg").textContent = "Không có thay đổi."; return; }
  try {
    for (let i = 0; i < changes.length; i += BATCH){
      const batch = writeBatch(db);
      changes.slice(i, i + BATCH).forEach(({ s, score, result }) => batch.update(doc(db, "enrollments", s.id), { score, result, updatedBy: me.name, updatedAt: serverTimestamp() }));
      await batch.commit();
    }
  } catch (err){ return alertErr("Chưa lưu được: " + err.message); }
  changes.forEach(({ s, score, result }) => { s.score = score; s.result = result; });
  $("#rMsg").textContent = `Đã lưu kết quả của ${changes.length} học viên.`;
}

      const [st, se] = await Promise.all([loadStudents(c.id), loadCSessions(c.id)]);
      rows = [["Họ và tên", ...se.map(x => fmtDate(x.date)), "Số buổi có mặt"],
        ...st.map(s => [s.memberName, ...se.map(x => (x.present || []).includes(s.memberId) ? "X" : ""), se.filter(x => (x.present || []).includes(s.memberId)).length])];
      name = `khoa-${slug(c.name)}-diem-danh`;
    } else return;
    await downloadRows(rows, name, fmt);
  } catch (err){ alertErr("Chưa xuất được: " + err.message); }
}

async function ssAct(a, el){
  const id = el.dataset.id;
  switch (a){
    case "ss-tab": SS.tab = el.dataset.tab; SS.detailClass = ""; SS.courseId = ""; return vSchool();
    case "ss-all-present": document.querySelectorAll('#aList [data-k="p"], #cList [data-k="p"]').forEach(c => c.checked = true);
      return attCount($("#aList") ? "#aList" : "#cList", !!$("#aList"));
    case "ss-save-att": return saveAttendance();
    case "ss-new-class": return openClassForm({});
    case "ss-edit-class": return openClassForm(SS.classes.find(c => c.id === id));
    case "ss-seed-classes": return seedClasses();
    case "ss-open-class": SS.detailClass = id; return ssClasses();
    case "ss-back-class": SS.detailClass = ""; return ssClasses();
    case "ss-remove-student": return removeFromClass(id);
    case "ss-load-ministry": return loadFromMinistry();
    case "ss-new-course": return openCourseFormSS({});
    case "ss-edit-course": return openCourseFormSS(courses.find(c => c.id === id));
    case "ss-open-course": SS.courseId = id; SS.cDate = ""; return ssCourses();
    case "ss-back-course": SS.courseId = ""; return ssCourses();

    case "ss-remove-course-student": return removeFromCourse(id);
    case "ss-cdate": SS.cDate = el.dataset.d; return ssCourseDetail();
    case "ss-save-catt": return saveCourseAtt();
    case "ss-export": return ssExport(el.dataset.what, el.dataset.fmt);
  }
}

/* ============ QUẢN TRỊ TÀI KHOẢN VÀ PHÂN QUYỀN ============ */
let usersList = [], uSearch = "", lastCred = "";
const ROLE_LABELS = { admin: "Quản trị hội thánh (Mục sư, Thư ký)", tribe: "Chi phái trưởng", finance: "Trưởng ban tài chính", ss: "Trường Chúa Nhật" };
const SS_LABELS = { head: "Trưởng ban", secretary: "Thư ký", teacher: "Giáo viên / trợ giảng" };

function roleText(u){
  if (u.role === "tribe") return `Chi phái trưởng, ${tribeName(u.tribe)}` + (u.ss ? `, Trường CN: ${SS_LABELS[u.ss] || u.ss}` : "");
  if (u.role === "ss") return `Trường Chúa Nhật: ${SS_LABELS[u.ss] || u.ss || "—"}`;
  return ROLE_LABELS[u.role] || u.role || "—";
}

function genPassword(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";   // bỏ ký tự dễ nhầm: I, l, O, 0, 1
  const a = new Uint32Array(12);
  crypto.getRandomValues(a);
  return [...a].map(n => chars[n % chars.length]).join("");
}

function authMsg(err){
  const m = {
    "auth/email-already-in-use": "Email này đã có tài khoản đăng nhập. Nếu hồ sơ phân quyền chưa có, vào Firebase Console > Authentication copy UID rồi nhập vào mục “Tài khoản đã có sẵn”.",
    "auth/invalid-email": "Email không hợp lệ.",
    "auth/weak-password": "Mật khẩu quá yếu, cần tối thiểu 8 ký tự.",
    "auth/operation-not-allowed": "Chưa bật đăng nhập Email/Password trong Firebase Authentication.",
    "auth/network-request-failed": "Mất kết nối mạng, thử lại sau."
  };
  return m[err.code] || err.message;
}

async function vUsers(){
  $("#main").innerHTML = `
    <div class="head"><div><h1>Tài khoản</h1><div class="sub">Tạo tài khoản và phân quyền cho người dùng</div></div>
      <button class="btn" data-act="user-new">Thêm tài khoản</button></div>
    <div class="toolbar"><input id="uQ" type="search" placeholder="Tìm theo tên hoặc email" value="${esc(uSearch)}"></div>
    <div id="ubody"><div class="empty">Đang tải…</div></div>`;
  $("#uQ").oninput = e => { uSearch = e.target.value; renderUsers(); };
  try {
    const snap = await getDocs(collection(db, "users"));
    usersList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (err){
    $("#ubody").innerHTML = `<div class="empty">Không tải được danh sách (${esc(err.message)}). Kiểm tra Firestore Rules.</div>`;
    return;
  }
  if (view === "users") renderUsers();
}

function renderUsers(){
  if (!$("#ubody")) return;
  const q = fold(uSearch.trim());
  const list = usersList.filter(u => !q || fold((u.name || "") + " " + (u.email || "")).includes(q))
    .sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "vi"));
  $("#ubody").innerHTML = list.length ? `<div class="scroll"><table>
    <thead><tr><th>Người dùng</th><th>Vai trò</th></tr></thead><tbody>
    ${list.map(u => `<tr data-act="user-open" data-id="${esc(u.id)}" style="cursor:pointer">
      <td><strong>${esc(u.name || "(chưa có tên)")}</strong>${u.id === me.uid ? `<span class="badge">Bạn</span>` : ""}${u.active === false ? `<span class="badge" style="color:var(--danger);border-color:var(--danger)">Đã khóa</span>` : ""}
        <div class="sub">${esc(u.email || "chưa có email")}</div></td>
      <td>${esc(roleText(u))}</td></tr>`).join("")}</tbody></table></div>
    <div class="hint" style="margin-top:8px">${usersList.length} tài khoản. Không xóa tài khoản, chỉ khóa để giữ lại lịch sử thao tác.</div>`
    : `<div class="empty">${usersList.length ? "Không có kết quả phù hợp." : "Chưa có hồ sơ tài khoản nào."}</div>`;
}

function userForm(u = {}){
  const isNew = !u.id;
  return `
  <form class="dlg form" id="fu" data-id="${esc(u.id || "")}">
    <h2 class="full">${isNew ? "Thêm tài khoản" : "Sửa tài khoản"}</h2>
    <label class="full">Họ và tên *<input name="name" required value="${esc(u.name)}"></label>
    <label class="full">Email đăng nhập *<input type="email" name="email" required value="${esc(u.email)}" ${!isNew && u.email ? "readonly" : ""}>
      ${!isNew && !u.email ? `<div class="hint">Hồ sơ này chưa có email. Nhập đúng email đăng nhập để gửi được thư đặt lại mật khẩu.</div>` : ""}</label>
    <label class="full">Vai trò *<select name="role" id="uRole" required>
      <option value="">Chọn vai trò</option>
      ${Object.entries(ROLE_LABELS).map(([k, v]) => opt(k, u.role, v)).join("")}</select></label>
    <label id="uTribeWrap" class="full">Chi phái *<select name="tribe">
      <option value="">Chọn chi phái</option>${TRIBES.map(t => opt(t, u.tribe, tribeName(t))).join("")}</select></label>
    <label id="uSsWrap" class="full">Vai trò trong Trường Chúa Nhật<select name="ss">
      <option value="">Không tham gia</option>${Object.entries(SS_LABELS).map(([k, v]) => opt(k, u.ss, v)).join("")}</select>
      <div class="hint">Giáo viên, trợ giảng chỉ thấy các lớp và khóa được phân công (Trưởng ban nhập email của họ khi tạo lớp, khóa).</div></label>
    ${isNew ? `
    <label class="full">Mật khẩu tạm thời
      <div style="display:flex;gap:8px"><input name="pw" id="uPw" value="${genPassword()}" minlength="8" autocomplete="off" style="font-family:ui-monospace,monospace">
        <button type="button" class="btn ghost sm" data-act="user-genpw">Tạo lại</button></div>
      <div class="hint">Mật khẩu chỉ hiện một lần sau khi tạo. Yêu cầu người dùng bấm “Đổi mật khẩu” ngay sau lần đăng nhập đầu tiên.</div></label>
    <details class="full"><summary class="hint" style="cursor:pointer">Tài khoản đã có sẵn trong Firebase Authentication?</summary>
      <label style="margin-top:8px">UID<input name="uid" placeholder="Dán UID từ Firebase Console" autocomplete="off"></label>
      <div class="hint">Nếu nhập UID, hệ thống chỉ tạo hồ sơ phân quyền, không tạo tài khoản đăng nhập mới.</div></details>`
    : `<label class="full check"><input type="checkbox" name="active" ${u.active === false ? "" : "checked"}> Đang hoạt động (bỏ chọn để khóa tài khoản)</label>`}
    <div class="dlg-foot full">
      ${isNew ? "" : `<button type="button" class="btn ghost" data-act="user-reset" data-id="${esc(u.id)}">Gửi email đặt lại mật khẩu</button>`}
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-act="close">Hủy</button>
      <button class="btn" type="submit">${isNew ? "Tạo tài khoản" : "Lưu"}</button>
    </div>
  </form>`;
}

function syncUserForm(){
  const f = $("#fu");
  if (!f) return;
  const r = f.role.value;
  $("#uTribeWrap").classList.toggle("hidden", r !== "tribe");
  $("#uSsWrap").classList.toggle("hidden", !(r === "tribe" || r === "ss"));
  f.tribe.required = r === "tribe";
  f.ss.required = r === "ss";
  f.ss.options[0].textContent = r === "ss" ? "Chọn vai trò" : "Không tham gia";
}

function openUserForm(u = {}){
  if (u.id && u.id === me.uid){
    openDialog(`<div class="dlg"><h2>${esc(u.name || "Tài khoản của bạn")}</h2>
      <p class="muted">Đây là tài khoản của bạn (${esc(roleText(u))}). Để tránh tự khóa quyền quản trị, bạn không thể tự đổi vai trò hoặc khóa chính mình. Nhờ một quản trị viên khác nếu cần.</p>
      <div class="dlg-foot"><span class="spacer"></span><button class="btn ghost" data-act="close">Đóng</button>
      <button class="btn" data-act="pw-reset">Gửi email đổi mật khẩu cho tôi</button></div></div>`);
    return;
  }
  openDialog(userForm(u));
  $("#fu").addEventListener("change", syncUserForm);
  syncUserForm();
}

async function saveUser(id, fd){
  const role = fd.get("role");
  const name = fd.get("name").trim();
  const email = fd.get("email").trim().toLowerCase();
  const tribe = role === "tribe" ? Number(fd.get("tribe")) : null;
  const ss = (role === "tribe" || role === "ss") ? (fd.get("ss") || null) : null;
  if (!name) return alertErr("Vui lòng nhập họ tên.");
  if (!Object.keys(ROLE_LABELS).includes(role)) return alertErr("Vui lòng chọn vai trò.");
  if (role === "tribe" && !TRIBES.includes(tribe)) return alertErr("Vui lòng chọn chi phái.");
  if (role === "ss" && !ss) return alertErr("Vui lòng chọn vai trò trong Trường Chúa Nhật.");
  const base = { name, role, tribe, ss, email };

  if (id){
    const active = fd.get("active") === "on";
    try { await updateDoc(doc(db, "users", id), { ...base, active, updatedBy: me.name, updatedAt: serverTimestamp() }); }
    catch (err){ return alertErr("Chưa lưu được: " + err.message); }
    Object.assign(usersList.find(u => u.id === id), { ...base, active });
    closeDialog(); renderUsers();
    return;
  }

  if (usersList.some(u => u.email === email)) return alertErr("Email này đã có hồ sơ tài khoản. Hãy mở hồ sơ đó để sửa.");
  const manualUid = (fd.get("uid") || "").trim();
  if (manualUid && usersList.some(u => u.id === manualUid)) return alertErr("UID này đã có hồ sơ phân quyền.");
  const pw = fd.get("pw") || "";
  let uid = manualUid;
  if (!uid){
    if (pw.length < 8) return alertErr("Mật khẩu tạm cần tối thiểu 8 ký tự.");
    try {
      // Dùng ứng dụng Firebase phụ để tạo tài khoản mà không làm quản trị viên bị đăng xuất
      const cred = await createUserWithEmailAndPassword(secAuth, email, pw);
      uid = cred.user.uid;
      await signOut(secAuth);
    } catch (err){ return alertErr(authMsg(err)); }
  }
  try {
    await setDoc(doc(db, "users", uid), { ...base, active: true, createdBy: me.name, createdAt: serverTimestamp() });
  } catch (err){
    return alertErr(`Đã tạo tài khoản đăng nhập nhưng chưa lưu được phân quyền (${err.message}). UID: ${uid}. Mở lại “Thêm tài khoản”, nhập UID này vào mục “Tài khoản đã có sẵn” để hoàn tất.`);
  }
  usersList.push({ id: uid, ...base, active: true });
  closeDialog();
  showCredentials({ name, email, pw: manualUid ? null : pw });
  renderUsers();
}

function showCredentials({ name, email, pw }){
  lastCred = `Sổ Tín Hữu\nĐịa chỉ: ${location.origin}${location.pathname}\nEmail: ${email}\n`
    + (pw ? `Mật khẩu tạm: ${pw}\nVui lòng bấm “Đổi mật khẩu” sau khi đăng nhập lần đầu.` : "Dùng mật khẩu hiện có của tài khoản này.");
  openDialog(`<div class="dlg"><h2>Đã tạo tài khoản cho ${esc(name)}</h2>
    <p class="muted">Gửi thông tin này cho người dùng qua kênh riêng. ${pw ? "Mật khẩu chỉ hiện một lần, đóng hộp thoại là không xem lại được." : ""}</p>
    <div class="cred">${esc(lastCred)}</div>
    <div class="dlg-foot"><span class="spacer"></span>
      <button class="btn ghost" data-act="close">Đóng</button>
      <button class="btn" data-act="user-copy">Sao chép</button></div></div>`);
}

async function sendReset(email){
  if (!email) return alertErr("Hồ sơ này chưa có email.");
  try {
    await sendPasswordResetEmail(auth, email);
    alert(`Đã gửi email đặt lại mật khẩu tới ${email}.`);
  } catch (err){ alertErr(authMsg(err)); }
}

async function userAct(a, el){
  const id = el.dataset.id;
  if (a === "user-new") return openUserForm({});
  if (a === "user-open") return openUserForm(usersList.find(u => u.id === id));
  if (a === "user-genpw"){ const i = $("#uPw"); if (i) i.value = genPassword(); return; }
  if (a === "user-reset") return sendReset(usersList.find(u => u.id === id)?.email || $("#fu")?.email.value.trim().toLowerCase());
  if (a === "user-copy"){
    try { await navigator.clipboard.writeText(lastCred); el.textContent = "Đã sao chép"; }
    catch { alertErr("Trình duyệt không cho sao chép tự động. Hãy bôi đen nội dung và sao chép thủ công."); }
  }
}

/* ============ SỰ KIỆN CHUNG ============ */
document.addEventListener("focusin", e => { if (e.target.classList?.contains("qamt")) qActive = e.target; });

document.addEventListener("click", async e => {
  const act = e.target.closest("[data-act]");
  if (act){
    e.preventDefault();
    const a = act.dataset.act, id = act.dataset.id;
    if (a === "close") return closeDialog();
    if (a === "logout") return signOut(auth);
    if (a === "pw-reset") return sendReset(auth.currentUser?.email);
    if (a.startsWith("user-")) return userAct(a, act);
    if (a === "nav"){ view = act.dataset.view; return render(); }
    if (a === "add-member") return openMemberForm({});
    if (a === "edit-member") return openMemberForm(members.find(x => x.id === id));
    if (a === "del-member") return deleteMember(id);
    if (a === "add-household") return openHouseholdForm({});
    if (a === "edit-household") return openHouseholdForm(households.find(x => x.id === id));
    if (a === "del-household") return deleteHousehold(id);
    if (a === "add-to-household"){
      const h = households.find(x => x.id === id);
      closeDialog();
      return openMemberForm({ householdId: id, tribe: h?.tribe });
    }
    if (a === "add-course") return openCourseForm();
    if (a === "del-enroll") return deleteEnroll(id);
    if (a === "export") return exportCSV();
    if (a === "add-offering") return openOfferingForm({});
    if (a === "del-offering") return deleteOffering(id);
    if (a === "off-tab"){ offTab = act.dataset.tab; return vOfferings(); }
    if (a === "export-offerings") return exportOfferings();
    if (a === "export-report") return exportReport();
    if (a === "q-add-line"){
      $("#qLines").insertAdjacentHTML("beforeend", lineRow(store.get("fund", FUNDS[0])));
      $("#qLines .qline:last-child .qamt").focus();
      return;
    }
    if (a === "q-del-line"){
      if (document.querySelectorAll("#qLines .qline").length > 1) act.closest(".qline").remove();
      $("#fq")?.dispatchEvent(new Event("input"));
      return;
    }
    if (a === "q-amt"){
      const t = (qActive && document.body.contains(qActive)) ? qActive : $("#qLines .qamt");
      t.value = act.dataset.v;
      t.dispatchEvent(new Event("input", { bubbles: true }));
      t.focus();
      return;
    }
    if (a === "q-test") return printReceipt(testReceipt());
    if (a === "reprint") return printReceipt(receiptLines(act.dataset.no));
    if (a === "void-receipt") return voidReceipt(act.dataset.no);
    if (a.startsWith("ss-")) return ssAct(a, act);
    return;
  }
  const row = e.target.closest("[data-open]");
  if (row){
    e.preventDefault();
    const [k, id] = row.dataset.open.split(":");
    if (k === "m") openMemberDetail(id);
    if (k === "h") openHouseholdDetail(id);
    if (k === "o") openOfferingDetail(id);
  }
});

document.addEventListener("submit", async e => {
  const f = e.target;
  e.preventDefault();
  const fd = new FormData(f);
  if (f.id === "fm")      return saveMember(f.dataset.id || null, fd);
  if (f.id === "fh")      return saveHousehold(f.dataset.id || null, fd);
  if (f.id === "fc")      return saveCourse(fd);
  if (f.id === "fe")      return enroll(f.dataset.member, fd);
  if (f.id === "fu")      return saveUser(f.dataset.id || null, fd);
  if (f.id === "fq")      return saveQuick(fd);
  if (f.id === "fcls")    return saveClass(f.dataset.id || null, fd);
  if (f.id === "fcrs")    return saveCourseSS(f.dataset.id || null, fd);
  if (f.id === "fadd")    return ssAddMember(fd, f.dataset.kind);
  if (f.id === "fo")      return saveOffering(f.dataset.id || null, fd, e.submitter?.dataset.next === "1");
});
